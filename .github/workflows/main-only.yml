name: Ubuntuリポジトリ受入検証（手動）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-check:
    name: Ubuntu環境でリポジトリ契約を検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 日本語基底と現在状態を検証
        run: python3 道具/リポジトリ環境監査.py
