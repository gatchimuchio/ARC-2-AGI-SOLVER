name: Repository guard

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository operating environment
        run: python3 scripts/check_repository_environment.py

  sync-official-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned official ARC-AGI-2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/arcprize/ARC-AGI-2.git "$RUNNER_TEMP/ARC-AGI-2"
          git -C "$RUNNER_TEMP/ARC-AGI-2" checkout f3283f727488ad98fe575ea6a5ac981e4a188e49
      - name: Generate and verify Kaggle official sample
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_official_sample.py \
            --source "$RUNNER_TEMP/ARC-AGI-2" \
            --output data/official_sample
      - name: Commit verified sample when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/official_sample/*.json
          if git diff --cached --quiet; then
            echo "Official sample already matches uploaded source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified ARC-AGI-2 official sample"
          git push origin HEAD:main

  keep-main-only:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ -z "$branch" || "$branch" == "$DEFAULT_BRANCH" ]]; then
              continue
            fi

            encoded_branch="$(python3 - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=""))
          PY
          )"

            echo "Deleting branch: ${branch}"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_branch}"
          done
